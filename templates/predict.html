<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Prediction</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .form-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input,
        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
        }

        .submit {
            width: 100%;
            margin-top: 25px;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            background: #172554;
            border-radius: 15px;
            text-align: center;
        }

        .probability {
            font-size: 42px;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
        }

        .result-label {
            font-size: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Customer Churn Prediction</h1>

    <p class="subtitle">
        Enter the customer's details below
    </p>

    <div class="form-card">

        <form method="POST" action="/predict">

            <div class="grid">

                <div class="field">
                    <label>Credit Score</label>
                    <input type="number"
                           name="CreditScore"
                           required>
                </div>

                <div class="field">
                    <label>Geography</label>

                    <select name="Geography" required>
                        <option value="">Select Country</option>
                        <option value="France">France</option>
                        <option value="Germany">Germany</option>
                        <option value="Spain">Spain</option>
                    </select>
                </div>

                <div class="field">
                    <label>Gender</label>

                    <select name="Gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="field">
                    <label>Age</label>
                    <input type="number"
                           name="Age"
                           required>
                </div>

                <div class="field">
                    <label>Tenure</label>
                    <input type="number"
                           name="Tenure"
                           required>
                </div>

                <div class="field">
                    <label>Balance</label>
                    <input type="number"
                           step="any"
                           name="Balance"
                           required>
                </div>

                <div class="field">
                    <label>Number of Products</label>
                    <input type="number"
                           name="NumOfProducts"
                           required>
                </div>

                <div class="field">
                    <label>Has Credit Card</label>

                    <select name="HasCrCard" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Active Member</label>

                    <select name="IsActiveMember" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Estimated Salary</label>
                    <input type="number"
                           step="any"
                           name="EstimatedSalary"
                           required>
                </div>

            </div>

            <button type="submit" class="submit">
                Predict Customer Churn
            </button>

        </form>


        {% if result %}

        <div class="result">

            <h2>Prediction Result</h2>

            <div class="probability">
                {{ result.probability }}
            </div>

            <div class="result-label">
                {{ result.label }}
            </div>

        </div>

        {% endif %}

    </div>

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

</body>

</html>
